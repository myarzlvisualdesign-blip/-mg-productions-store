<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7c3aed" />
    <title>MG PRODUCTIONS Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090611;
        --panel: rgba(24, 16, 38, 0.96);
        --border: rgba(139, 92, 246, 0.22);
        --text: #f5f3ff;
        --muted: #b7b1c7;
        --accent: #a855f7;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(168, 85, 247, 0.16), transparent 34%),
          radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 30%),
          var(--bg);
        color: var(--text);
      }

      @supports (height: 100dvh) {
        body {
          min-height: 100dvh;
        }
      }

      .card {
        width: min(100%, 460px);
        padding: 28px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(168, 85, 247, 0.12);
        color: #e9d5ff;
        font-size: 12px;
        font-weight: 600;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: clamp(28px, 6vw, 38px);
        line-height: 1.05;
      }

      p {
        margin: 0;
        line-height: 1.65;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 148px;
        padding: 12px 16px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-decoration: none;
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
        font-weight: 600;
      }

      .button.primary {
        background: linear-gradient(135deg, #9333ea, #7c3aed);
        border-color: transparent;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">MG PRODUCTIONS</div>
      <h1>Koneksi sedang offline</h1>
      <p>
        Aplikasi tetap bisa dibuka, tetapi beberapa fitur seperti produk terbaru,
        checkout, top up, dan data admin tetap membutuhkan internet.
      </p>
      <div class="actions">
        <a class="button primary" href="/">Coba Lagi</a>
        <a class="button" href="/" onclick="window.location.reload()">Refresh</a>
      </div>
    </main>
  </body>
</html>
